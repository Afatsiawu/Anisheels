services:
  - type: web
    name: anisheels
    runtime: static
    repo: https://github.com/Afatsiawu/Anisheels.git
    branch: main
    rootDir: project
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      # Ensure SPA deep links work (e.g. /admin/*)
      - type: rewrite
        source: /admin
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: /index.html

      # General catch-all for any other client-side routes
      - type: rewrite
        source: /*
        destination: /index.html
